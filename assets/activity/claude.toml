# Bundled screen-detection manifest for Claude (v1).
manifest_version = 1

[[rule]]
id = "permission-prompt"
state = "blocked"
screen_any = ["Approve", "Allow", "accept?", "(y/n)", "[y/n]", "Yes, proceed", "Proceed?"]

[[rule]]
id = "spinner"
state = "working"
screen_any = ["Working", "Thinking", "esc to interrupt", "Esc to interrupt", "⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"]
