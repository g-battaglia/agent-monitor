[package]
name = "agent-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal session explorer for coding agents"
repository = "https://github.com/g-battaglia/agent-monitor"
keywords = ["tui", "agent", "sessions", "tmux", "explorer"]
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
